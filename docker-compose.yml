# docker compose up --build   ->  control panel http://localhost:3000 (admin password from .env), API http://localhost:8000
# Not verified in the build environment (Docker was not installed there); see README troubleshooting.
services:
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      FINGUARD_DB_PATH: /data/finguard.db
      FINGUARD_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes: ["finguard-data:/data"]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  finguard-data:
