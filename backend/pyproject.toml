[project]
name = "finguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2",
  "pyyaml>=6", "httpx>=0.27", "nemoguardrails>=0.24",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
